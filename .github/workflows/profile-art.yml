name: generate profile art

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # GitHub force-runs Node16/20-targeted actions on the Node24 runtime now,
    # which breaks some older actions outright. This is the documented
    # escape hatch, scoped to this job only.
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sbktckp
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: generate 3d contribution graph
        id: contrib3d
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: sbktckp

      - name: fold 3d contribution graph into dist, if it built
        run: |
          mkdir -p dist/3d-contrib
          if compgen -G "profile-3d-contrib/*.svg" > /dev/null; then
            cp profile-3d-contrib/*.svg dist/3d-contrib/
            echo "3d contrib graph included"
          else
            echo "::warning::3d contribution graph step did not produce svgs, shipping snake only"
          fi

      # Everything above lands in dist/ and is pushed together, so a failed
      # 3d-contrib step never blocks the snake from shipping.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
