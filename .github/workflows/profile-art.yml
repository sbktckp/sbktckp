name: generate profile art

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sbktckp
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: generate isometric 3d contribution calendar
        id: isocalendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: dist/isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: report whether the 3d calendar built
        run: |
          if [ -f "dist/isocalendar.svg" ]; then
            echo "isocalendar built"
          else
            echo "::warning::isocalendar plugin did not produce an svg, shipping snake only"
          fi

      # Everything above lands in dist/ and is pushed together, so a failed
      # isocalendar step never blocks the snake from shipping.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
