<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">
  <style>
    .row{opacity:0;animation:rise .5s ease forwards}
    .d1{animation-delay:.2s} .c1{animation-delay:.4s}
    .d2{animation-delay:.6s} .c2{animation-delay:.8s}
    .c3{animation-delay:1.2s} .c4{animation-delay:1.6s}
    .bal{opacity:0;animation:rise .5s ease forwards;animation-delay:2.1s}
    @keyframes rise{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
    .cur{animation:blink 1s step-end infinite;animation-delay:2.6s}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .credit{fill:#3ECF8E} .debit{fill:#FF6B6B} .accent{fill:#7C5CFC}
    .muted{fill:#8B92A8} .ink{fill:#E4E7EE}
  </style>
  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="#0B0E14" stroke="#232838"/>
  <text x="40" y="52" font-size="26" font-weight="700" letter-spacing="3" class="ink">GENERAL LEDGER</text>
  <text x="40" y="76" font-size="12" letter-spacing="1" class="muted">ACCT: sbktckp   ·   STATEMENT PERIOD 2024 — PRESENT</text>
  <line x1="40" y1="96" x2="880" y2="96" stroke="#232838"/>

  <text x="40" y="120" font-size="11" font-weight="700" letter-spacing="2" class="debit">DEBIT</text>
  <text x="480" y="120" font-size="11" font-weight="700" letter-spacing="2" class="credit">CREDIT</text>
  <line x1="460" y1="108" x2="460" y2="290" stroke="#232838"/>

  <g class="row d1">
    <text x="40" y="156" font-size="13" class="ink">Intern — Horizontal</text>
    <text x="440" y="156" font-size="12" text-anchor="end" class="debit">CLOSED</text>
  </g>
  <g class="row d2">
    <text x="40" y="190" font-size="13" class="ink">8hrs of sleep, nightly</text>
    <text x="440" y="190" font-size="12" text-anchor="end" class="debit">CLOSED</text>
  </g>

  <g class="row c1">
    <text x="480" y="156" font-size="13" class="ink">CTO — Clipency</text>
    <text x="880" y="156" font-size="12" text-anchor="end" class="credit">ACTIVE</text>
  </g>
  <g class="row c2">
    <text x="480" y="190" font-size="13" class="ink">Web Developer — NexElite</text>
    <text x="880" y="190" font-size="12" text-anchor="end" class="credit">ACTIVE</text>
  </g>
  <g class="row c3">
    <text x="480" y="224" font-size="13" class="ink">Ekam Finance, shipped &amp; growing</text>
    <text x="880" y="224" font-size="12" text-anchor="end" class="accent">ONGOING</text>
  </g>
  <g class="row c4">
    <text x="480" y="258" font-size="13" class="ink">APD debate, current season</text>
    <text x="880" y="258" font-size="12" text-anchor="end" class="credit">ACTIVE</text>
  </g>

  <line x1="40" y1="284" x2="880" y2="284" stroke="#232838"/>
  <g class="bal">
    <text x="40" y="316" font-size="13" font-weight="700" letter-spacing="1" class="muted">BALANCE</text>
    <text x="880" y="316" font-size="13" font-weight="700" text-anchor="end" class="accent">UNRECONCILED, ON PURPOSE<tspan class="cur">_</tspan></text>
  </g>
</svg>
